name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests (detection logic + state machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: bash tests/host/run_tests.sh

  firmware-build:
    name: Firmware build (PlatformIO, ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
